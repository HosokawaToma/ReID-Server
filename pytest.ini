[pytest]
# テストファイルのパターン
python_files = test_*.py *_test.py
# テストクラスのパターン
python_classes = Test*
# テスト関数のパターン
python_functions = test_*

# テストディレクトリ
testpaths = src/tests

# 非同期テストの設定
asyncio_mode = auto

# カバレッジ設定
addopts =
    --cov=src
    --cov-report=term-missing
    --strict-markers
    -v

# マーカーの定義
markers =
    unit: ユニットテスト
    integration: 統合テスト
    slow: 実行に時間がかかるテスト

# 警告の設定
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

