name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    env:
      SOURCE_DIR: src/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4 pyright==1.1.391

      - name: Run Ruff linter
        run: ruff check ${{ env.SOURCE_DIR }}

      - name: Run Ruff formatter check
        run: ruff format --check ${{ env.SOURCE_DIR }}

      - name: Run Pyright
        run: pyright ${{ env.SOURCE_DIR }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reid-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
